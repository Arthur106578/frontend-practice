<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程反馈信息采集</title>
</head>
<body>
  <h1>课程反馈信息采集表</h1>
  <p>请填写以下信息，帮助我们改进课程教学质量。</p>

  <form action="#" method="post">
    <h2>基本信息</h2>
    <p>
      <label for="name">姓名：</label>
      <input type="text" id="name" name="name" placeholder="请输入你的姓名" required>
    </p>
    <p>
      <label for="studentId">学号：</label>
      <input type="text" id="studentId" name="studentId" placeholder="请输入你的学号" required>
    </p>
    <p>
      <label for="class">班级：</label>
      <input type="text" id="class" name="class" placeholder="请输入你的班级">
    </p>

    <h2>课程评价</h2>
    <p>
      <label for="course">课程名称：</label>
      <input type="text" id="course" name="course" placeholder="请输入课程名称" required>
    </p>
    <p>
      <label>课程难度：</label>
      <input type="radio" id="easy" name="difficulty" value="easy">
      <label for="easy">简单</label>
      <input type="radio" id="medium" name="difficulty" value="medium">
      <label for="medium">适中</label>
      <input type="radio" id="hard" name="difficulty" value="hard">
      <label for="hard">困难</label>
    </p>
    <p>
      <label>授课方式满意度：</label>
      <input type="checkbox" id="satisfaction1" name="satisfaction" value="lecture">
      <label for="satisfaction1">课堂讲授</label>
      <input type="checkbox" id="satisfaction2" name="satisfaction" value="practice">
      <label for="satisfaction2">实践操作</label>
      <input type="checkbox" id="satisfaction3" name="satisfaction" value="discussion">
      <label for="satisfaction3">讨论互动</label>
    </p>
    <p>
      <label for="rating">总体评分：</label>
      <select id="rating" name="rating">
        <option value="">请选择</option>
        <option value="5">5分（非常满意）</option>
        <option value="4">4分（满意）</option>
        <option value="3">3分（一般）</option>
        <option value="2">2分（不满意）</option>
        <option value="1">1分（非常不满意）</option>
      </select>
    </p>
    <p>
      <label for="feedback">意见建议：</label><br>
      <textarea id="feedback" name="feedback" rows="5" cols="40" placeholder="请输入你对课程的意见和建议" required></textarea>
    </p>
    <p>
      <input type="submit" value="提交反馈">
      <input type="reset" value="重置表单">
    </p>
  </form>
</body>
</html>
